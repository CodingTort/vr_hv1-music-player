[package]
name = "lavanda"
version = "1.2.1"
edition = "2021"
rust-version = "1.89"
description = "vr_hv1's Music Player: a native Linux music player with synced lyrics, furigana, romaji and YouTube downloads, a terminal client, and playback on your phone (a lavanda fork)"
license = "MIT"
repository = "https://github.com/CodingTort/vr_hv1-music-client"
readme = "README.md"
keywords = ["music-player", "lyrics", "wayland", "iced", "japanese"]
categories = ["multimedia::audio"]

[dependencies]
# GUI
iced = { version = "0.13", features = ["image", "canvas", "tokio", "advanced"] }

# Native file picker (background image)
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

# Áudio — decode
symphonia = { version = "0.5", features = ["all"] }

# Áudio — output
cpal = "0.15"

# Tags / metadados
lofty = "0.21"

# MPRIS2 (D-Bus)
mpris-server = "0.8"

# System tray icon (StatusNotifierItem + dbusmenu); the same zbus the file
# dialogs already pull in.
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

# Scanner de diretório
walkdir = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Processamento de imagem (capas de álbum)
image = "0.25"

# Erros ergonômicos
anyhow = "1"

# Configuração
toml = "0.8"
serde = { version = "1", features = ["derive"] }

# Gerador de números aleatórios (shuffle)
rand = "0.8"

# FFT (visualizador de espectro)
rustfft = "6"

# Persistência (favorites, playlists, play counts)
serde_json = "1"

# Data/hora (recently played)
chrono = { version = "0.4", features = ["serde"] }

# Terminal client (vrmusic-tui): terminal UI, wide-character widths, and the
# request parser for the phone player's small HTTP server.
ratatui = "0.30"
unicode-width = "0.2"
httparse = "1"
libc = "0.2"

# The GUI (src/main.rs) is found automatically.
[[bin]]
name = "vrmusic-tui"
path = "src/tui/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
